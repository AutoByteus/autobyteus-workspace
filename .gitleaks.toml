# gitleaks config for the secret gate (RELEASE.md, "Secret Gate").
# It holds no secret values.
#
# Usage: scripts/check_secrets.sh [<git-range>]
#
# - gitleaks' default rules, plus two rules for what the defaults miss.
# - Allowlists for false-positive classes confirmed by the
#   repository-secret-scan ticket (2026-10-20, tickets/done/repository-secret-scan).
#   Shape-based allowlists apply only to gitleaks' broad `generic-api-key`
#   rule, so they can never hide a provider-specific match or the
#   `env-style-secret` rule below.
# - Add an allowlist entry only after checking the value by shape and context
#   (never by testing it at a provider). Never allowlist a value because it is
#   inconvenient.

title = "autobyteus-workspace secret gate"

[extend]
useDefault = true

# A provider key assigned to an env-style name, such as SERPER_API_KEY=<40 hex>
# or MISTRAL_API_KEY="<32 chars>". It is not subject to the generic shape
# allowlists below, because some provider keys are plain hex.
[[rules]]
id = "env-style-secret"
description = "Key-like value assigned to an *_API_KEY / *_TOKEN / *_SECRET / *_PASSWORD name"
regex = '''\b[A-Z][A-Z0-9_]*(?:API_KEY|APIKEY|ACCESS_KEY|SECRET_KEY|_SECRET|_TOKEN|_PASSWORD)\b["']?\s*[:=]\s*["'`]?([A-Za-z0-9_\-+/]{20,})["'`]?(?:\s|$|[,;})\]])'''
secretGroup = 1
entropy = 3.2
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''(?i)(synthetic|canary|placeholder|replace|example|dummy|fake|redacted|your_|your-|changeme|sample|mock|test)''',
  '''^[a-z]+(?:[-_][a-z]+)+$''',
]

# A password inside a connection string or URL (postgres://user:password@host).
# The defaults miss this.
[[rules]]
id = "password-in-url"
description = "Password inside a connection string or URL"
regex = '''\b[a-z][a-z0-9+.-]{1,15}://[^\s:@/'"`]{1,64}:([^\s@/'"`]{6,})@[^\s'"`]+'''
secretGroup = 1
entropy = 2.5
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''^\$\{?[A-Za-z_][A-Za-z0-9_]*\}?$''',
  '''(?i)^(password|passwd|pass|secret|changeme|example|placeholder|redacted|xxx+|\*+|<[^>]*>|your[-_]?password)$''',
]

# --- Allowlists for the broad generic-api-key rule only ---------------------

# Hashes, git SHAs and ranges, UUIDs, and markers built on a UUID: file pins,
# run/agent IDs and test markers in ticket evidence.
[[allowlists]]
description = "Digests, SHAs, UUIDs and UUID-based markers (generic rule only)"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^[0-9a-f]{7,64}$''',
  '''^[0-9a-f]{7,40}\.\.\.?[0-9a-f]{7,40}$''',
  '''^([A-Za-z0-9]+[_-])*[0-9a-fA-F]{8}[-_][0-9a-fA-F]{4}[-_][0-9a-fA-F]{4}[-_][0-9a-fA-F]{4}[-_][0-9a-fA-F]{12}$''',
  # Vault secret IDs of MCP secrets (autobyteus-244): `mcp.<uuid>` names a
  # vault entry (GLOSSARY.md "Vault secret ID"); it is not the secret's value.
  # They appear as `{"vaultSecretId": "mcp.<uuid>"}` in tests and evidence.
  '''^mcp\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
]

# Words, slugs, file names and ticket case IDs that follow words like "api" or
# "token" in prose and logs.
[[allowlists]]
description = "Slugs, file names, word paths and ticket case IDs (generic rule only)"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^[a-z][a-z0-9]*(?:-[a-z0-9]+){2,}$''',
  '''^[A-Za-z0-9_.-]+\.(?:log|json|jsonl|md|txt|py|ts|js|mjs|sh|yaml|yml|png|patch)$''',
  '''^[A-Za-z]+(?:/[A-Za-z]+)+$''',
  '''^(?:API|IR|SR|DR|CR|CRR|AR|FU|AC|LIVE|UC|REV)-[A-Za-z0-9.-]+$''',
  '''^[a-z]+(?:[A-Z][a-z]+)+[0-9]{0,4}$''',
  # Made-up MCP gateway tokens in the McpGatewayPanel unit test (autobyteus-437):
  # a word plus a run of sequential digits, exactly these two values.
  '''^mcpg_(?:secretvalue1234567890|regenerated0987654321)$''',
  # The collaboration contract fixture's run ID for its "upscaler" agent
  # (autobyteus-461, `tests/fixtures/collaboration-contract/contract-states.json`),
  # a story placeholder in test evidence. Exactly this value.
  '''^upscaler_55b2$''',
]

# File-pin maps in ticket evidence: "path/file.ts": "<sha256>". Scoped to the
# two rules that match a bare 64-hex value.
[[allowlists]]
description = "sha256 file-pin entries (generic and discord rules only)"
targetRules = ["generic-api-key", "discord-api-token"]
regexTarget = "line"
regexes = [
  '''"[^"]+\.[A-Za-z0-9]{1,8}"\s*:\s*"[0-9a-f]{64}"''',
]

# Context-only false positives: the local dev server's websocket token
# (localhost only), websocket handshake keys, LLM response signatures, task keys,
# and code references to key variables (not their values).
[[allowlists]]
description = "Localhost dev-server tokens, handshake keys, signatures, task keys, env references (generic rule only)"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''wss?://(?:127\.0\.0\.1|localhost)(?::\d+)?[^\s"'`]*[?&]token=''',
  '''(?i)"sec-websocket-(?:key|accept)"\s*:''',
  '''"signature"\s*:''',
  '''"taskKey"\s*:''',
  '''process\.env\.[A-Z0-9_]+''',
]

# remove-skill-improvement (autobyteus-205): the retired setting name ENABLE_SKILL_IMPROVEMENT after the word
# "keys" in prose about a fixture's `.env` ("the three keys, `ENABLE_SKILL_IMPROVEMENT=true`"). It is a setting
# name with a boolean, not a credential; checked by shape and context. Only that exact text, and only for the generic rule.
[[allowlists]]
description = "Retired setting ENABLE_SKILL_IMPROVEMENT=true in fixture prose (generic rule only)"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = [
  '''^ENABLE_SKILL_IMPROVEMENT=true$''',
]

# --- Allowlists for every rule ------------------------------------------------

# Obvious test values used by fixtures and canary scans.
[[allowlists]]
description = "Synthetic fixture and canary values"
regexTarget = "secret"
regexes = [
  '''(?i)(synthetic|canary|placeholder|replace_with|dummy|fake)''',
  '''^(sk-)?1234567890abcdefghijklmnop$''',
]

# autobyteus-244 probe: `probes/agent-shell.sh` plays an agent shell and sends
# a deliberately forged, word-like `Authorization: Bearer` value to prove the
# credential proxy replaces it. It is not a token. Scoped to this one rule and
# file (the ticket's in-progress and archived paths).
[[allowlists]]
description = "Forged bearer value in the autobyteus-244 credential-proxy probe"
targetRules = ["curl-auth-header"]
paths = [
  '''^tickets/(in-progress|done)/secrets-and-integrations-design/probes/agent-shell\.sh$''',
]

# Vendored third-party bundles.
[[allowlists]]
description = "Vendored Monaco editor assets"
paths = [
  '''autobyteus-web-prototype/public/prototype-assets/monaco/''',
]

# SF-001: Telegram bot token in a generated messaging-gateway config, committed
# in c798a7e70c and removed in 46b172d0dd. The user revoked the token on
# 2026-10-20 and chose not to rewrite history (published tags). Only these two
# files in that one commit are allowlisted.
[[allowlists]]
description = "SF-001 revoked Telegram bot token (history only)"
condition = "AND"
commits = ["c798a7e70c3bc467346710f522c3b4cd289cbb59"]
paths = [
  '''^autobyteus-server-ts/extensions/messaging-gateway/config/(gateway\.env|provider-config\.json)$''',
]
# memory search (autobyteus-185): the secret masker's unit test
# (`tests/unit/memory-search/memory-search-index-units.test.ts`) feeds an
# AWS-key-shaped fixture: `AKIA` followed by the consecutive alphabet run
# `ABCDEFGHIJKLMNOP`, beside equally synthetic `sk-abcdef…` and `ghp_abcdef…`
# values. Checked by shape and context (release v1.5.9, autobyteus-319); never
# tested at a provider. Only that exact value, and only for the AWS rule.
[[allowlists]]
description = "Synthetic AWS-key fixture AKIA + ABCDEFGHIJKLMNOP in the masker test (aws-access-token rule only)"
targetRules = ["aws-access-token"]
regexTarget = "secret"
regexes = [
  '''^AKIAABCDEFGHIJKLMNOP$''',
]

# atomic-agent-run-creation (autobyteus-349): `evidence/API-349-probe.mjs` runs a scripted native inference server
# whose model list is `{ models: [{ key: 'ar349-fixture', … }] }`; the same name is the `model` of its replies. It is a
# fixture model ID, not a credential; checked by shape and context (release v1.5.11-beta.9, autobyteus-353). Only that
# exact value, only for the generic rule, and only in that probe (in-progress and archived paths).
[[allowlists]]
description = "Fixture model ID ar349-fixture in the autobyteus-349 probe (generic rule only)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^ar349-fixture$''',
]
paths = [
  '''^tickets/(in-progress|done)/atomic-agent-run-creation/evidence/API-349-probe\.mjs$''',
]

# ios-demo-mode-279 (autobyteus-279): the first line of API/E2E's log `API-02x-explore-safari.log` names its UI test,
# "API-02x-explore-safari: ApiE2E279UITests/testExploreSafari on apie2e279-iphone …"; the broad rule reads the test
# name after "API…:" as a key. It is an XCTest class and method name, not a credential; checked by shape and context
# (delivery, 2026-11-20). Only that exact value, only for the generic rule, and only in that log (in-progress and
# archived paths).
[[allowlists]]
description = "UI test name ApiE2E279UITests/testExploreSafari in the autobyteus-279 API/E2E log (generic rule only)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^ApiE2E279UITests/testExploreSafari$''',
]
paths = [
  '''^tickets/(in-progress|done)/ios-demo-mode-279/evidence/api-e2e/ios/API-02x-explore-safari\.log$''',
]

# sandbox-provider-relay-581 (autobyteus-581): API/E2E's Nodes page probe result `API-L11-nodes-page-sandbox-label.json`
# lists each row as `{"key": "srv_<32 characters>", "text": "sandbox", …}`. The row key is the peer's node ID, a public
# identifier (`GET /rest/remote-access/status` returns it with no credential, node access model NA-6); it is not a
# secret. Checked by shape and context (delivery, 2026-11-26). Only that shape, only for the generic rule, and only in
# that probe's two result files (in-progress and archived paths).
[[allowlists]]
description = "Node ID row keys in the autobyteus-581 Nodes page probe result (generic rule only)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^srv_[A-Za-z0-9]{32}$''',
]
paths = [
  '''^tickets/(in-progress|done)/sandbox-provider-relay-581/evidence/API-L11(?:-round2)?/API-L11-nodes-page-sandbox-label\.json$''',
]

# sandbox-provider-relay-581 (autobyteus-581): `const CLAUDE_API_KEY: SecretConsumerIdentity = Object.freeze({ … })` in
# the Claude runtime strategy names the vault entry that Claude's API-key mode uses. The env-style rule reads the
# TypeScript type name after the colon as a value; it is a type, not a credential (checked by shape and context,
# delivery, 2026-11-26). Only that exact text, in that one file.
[[allowlists]]
description = "TypeScript type name SecretConsumerIdentity after CLAUDE_API_KEY in the Claude runtime strategy (env-style rule only)"
targetRules = ["env-style-secret"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^SecretConsumerIdentity$''',
]
paths = [
  '''^autobyteus-server-ts/src/runtime-management/agent-runtimes/strategies/claude-agent-runtime-strategy\.ts$''',
]

# private-network (autobyteus-661): the peers-to-node-keys migration test synthesizes released `peers.json` rows with a
# made-up `peerSecret` each: base64url of the words "secret-paired", "secret-sandbox" and "secret-null". They are
# fixture text standing in for the old peer secrets the migration deletes, not credentials; checked by shape and
# context (implementation, 2026-11-27), never used anywhere else. Only these exact values, only for the generic rule,
# and only in that test file.
[[allowlists]]
description = "Made-up peerSecret fixture values in the autobyteus-661 migration test (generic rule only)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^(?:c2VjcmV0LXBhaXJlZA|c2VjcmV0LXNhbmRib3g|c2VjcmV0LW51bGw)$''',
]
paths = [
  '''^autobyteus-server-ts/tests/app-data-migrations/peers-to-node-keys/peers-to-node-keys-migration\.test\.ts$''',
]
