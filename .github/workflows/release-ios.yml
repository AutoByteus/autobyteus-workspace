name: iOS App Store Connect Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_app_store_connect:
        description: "Archive and upload the iOS app to App Store Connect/TestFlight"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag for version metadata when publishing (example: v1.2.7 or v1.2.7-rc1)"
        required: false
        type: string
      release_ref:
        description: "Git ref to build from during manual dispatch. Defaults to release_tag when set, otherwise the workflow ref."
        required: false
        type: string
      prerelease:
        description: "Mark manual-dispatch summary/TestFlight notes as prerelease"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.event.inputs.release_tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  IOS_APP_SCHEME: ${{ vars.IOS_APP_SCHEME || 'AutoByteusMobile' }}
  IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'org.autobyteus.mobile' }}
  IOS_SHARE_EXTENSION_BUNDLE_ID: ${{ vars.IOS_SHARE_EXTENSION_BUNDLE_ID || 'org.autobyteus.mobile.share' }}
  IOS_ARTIFACT_PREFIX: ${{ vars.IOS_ARTIFACT_PREFIX || 'AutoByteus_personal_ios' }}

jobs:
  prepare-release:
    name: Resolve iOS Release Metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_ref: ${{ steps.meta.outputs.release_ref }}
      semantic_version_core: ${{ steps.meta.outputs.semantic_version_core }}
      prerelease_label: ${{ steps.meta.outputs.prerelease_label }}
      ios_marketing_version: ${{ steps.meta.outputs.ios_marketing_version }}
      artifact_version: ${{ steps.meta.outputs.artifact_version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      publish_requested: ${{ steps.meta.outputs.publish_requested }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_sha: ${{ steps.sha.outputs.release_sha }}
    steps:
      - name: Checkout workflow helper scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_PUBLISH_APP_STORE_CONNECT: ${{ github.event.inputs.publish_app_store_connect || 'false' }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
          INPUT_RELEASE_REF: ${{ github.event.inputs.release_ref || '' }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease || 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 autobyteus-ios/scripts/resolve-ios-release-metadata.py

      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.release_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Resolve release commit SHA
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Summarize iOS release plan
        shell: bash
        run: |
          {
            echo "### iOS release plan"
            echo ""
            echo "Release ref: \`${{ steps.meta.outputs.release_ref }}\`"
            echo "Release tag: \`${{ steps.meta.outputs.release_tag || 'not publishing' }}\`"
            echo "Checked-out SHA: \`${{ steps.sha.outputs.release_sha }}\`"
            echo "iOS marketing version: \`${{ steps.meta.outputs.ios_marketing_version }}\`"
            echo "Artifact version: \`${{ steps.meta.outputs.artifact_version }}\`"
            echo "Build number: \`${{ steps.meta.outputs.build_number }}\`"
            echo "Prerelease label: \`${{ steps.meta.outputs.prerelease_label || 'none' }}\`"
            echo "Publish App Store Connect/TestFlight: \`${{ steps.meta.outputs.publish_requested }}\`"
            echo "Prerelease note: \`${{ steps.meta.outputs.prerelease }}\`"
            echo "Bundle ID: \`${{ env.IOS_BUNDLE_ID }}\`"
            echo "Share extension bundle ID: \`${{ env.IOS_SHARE_EXTENSION_BUNDLE_ID }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-ios:
    name: Build And Test iOS App
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodebuild -version
          xcrun simctl list devices available | sed -n '1,80p'

      - name: Select available iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_NAME="${IOS_SIMULATOR_NAME:-iPhone 17}"
          UDID="$(xcrun simctl list devices available | awk -v name="$SIMULATOR_NAME" '$0 ~ name && $0 ~ /Shutdown|Booted/ { gsub(/[()]/,"",$0); print $(NF-1); exit }')"
          if [[ -z "$UDID" ]]; then
            UDID="$(xcrun simctl list devices available | awk '/iPhone/ && /Shutdown|Booted/ { gsub(/[()]/,"",$0); print $(NF-1); exit }')"
          fi
          if [[ -z "$UDID" ]]; then
            echo "::error::No available iOS simulator found."
            exit 1
          fi
          echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"
          echo "Selected simulator UDID: $UDID"

      - name: Generate, build, and run implementation checks
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ env.IOS_BUNDLE_ID }}
          IOS_SHARE_EXTENSION_BUNDLE_ID: ${{ env.IOS_SHARE_EXTENSION_BUNDLE_ID }}
          MARKETING_VERSION: ${{ needs.prepare-release.outputs.ios_marketing_version }}
          CURRENT_PROJECT_VERSION: ${{ needs.prepare-release.outputs.build_number }}
        run: |
          set -euo pipefail
          BUILD_DIR="${RUNNER_TEMP}/ios-build"
          SMOKE_DIR="${RUNNER_TEMP}/ios-smoke"
          mkdir -p "$BUILD_DIR" "$SMOKE_DIR"

          autobyteus-ios/scripts/ios-release-contract-check.py 2>&1 | tee "$BUILD_DIR/ios-release-contract-check.log"

          autobyteus-ios/scripts/generate-project.sh 2>&1 | tee "$BUILD_DIR/generate-project.log"

          xcodebuild \
            -project autobyteus-ios/AutoByteusMobile.xcodeproj \
            -scheme "${IOS_APP_SCHEME}" \
            -destination "$IOS_SIMULATOR_DESTINATION" \
            IOS_BUNDLE_ID="$IOS_BUNDLE_ID" \
            IOS_SHARE_EXTENSION_BUNDLE_ID="$IOS_SHARE_EXTENSION_BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            build 2>&1 | tee "$BUILD_DIR/xcodebuild-simulator-build.log"

          rm -rf "$BUILD_DIR/AutoByteusMobileCoreTests.xcresult"
          xcodebuild \
            -project autobyteus-ios/AutoByteusMobile.xcodeproj \
            -scheme "${IOS_APP_SCHEME}" \
            -destination "$IOS_SIMULATOR_DESTINATION" \
            -resultBundlePath "$BUILD_DIR/AutoByteusMobileCoreTests.xcresult" \
            -only-testing:AutoByteusMobileCoreTests \
            IOS_BUNDLE_ID="$IOS_BUNDLE_ID" \
            IOS_SHARE_EXTENSION_BUNDLE_ID="$IOS_SHARE_EXTENSION_BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            test 2>&1 | tee "$BUILD_DIR/xcodebuild-core-tests.log"

          autobyteus-ios/scripts/ios-simulator-smoke.sh "$SMOKE_DIR" 2>&1 | tee "$SMOKE_DIR/simulator-smoke.log"

          app_path="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/AutoByteus.app' -type d | head -n 1 || true)"
          if [[ -n "$app_path" && -d "$app_path" ]]; then
            ditto -c -k --keepParent "$app_path" "$BUILD_DIR/${IOS_ARTIFACT_PREFIX}-${{ needs.prepare-release.outputs.artifact_version }}-simulator-app.zip"
          fi

      - name: Write publish secret readiness summary
        if: always()
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_PASSWORD }}
          IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          IOS_SHARE_EXTENSION_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          BUILD_DIR="${RUNNER_TEMP}/ios-build"
          mkdir -p "$BUILD_DIR"
          required=(
            IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_P12_PASSWORD
            IOS_APPSTORE_PROVISIONING_PROFILE_BASE64
            IOS_DEVELOPMENT_TEAM
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_P8_BASE64
          )
          if [[ -d autobyteus-ios/AutoByteusMobileShareExtension ]]; then
            required+=(IOS_SHARE_EXTENSION_APPSTORE_PROVISIONING_PROFILE_BASE64)
          fi
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          {
            echo "Publish requested: ${{ needs.prepare-release.outputs.publish_requested }}"
            echo "Required iOS publish secrets: ${required[*]}"
            if (( ${#missing[@]} > 0 )); then
              echo "Missing iOS publish secrets: ${missing[*]}"
            else
              echo "Missing iOS publish secrets: none detected"
            fi
            echo "Existing desktop APPLE_* secrets are intentionally not accepted for iOS App Store signing."
          } > "$BUILD_DIR/publish-secret-readiness.txt"
          cat "$BUILD_DIR/publish-secret-readiness.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS build/test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-test-artifacts
          path: |
            ${{ runner.temp }}/ios-build/**
            ${{ runner.temp }}/ios-smoke/**
          if-no-files-found: warn
          retention-days: 14

  publish-secret-gate:
    name: Validate iOS Publish Secrets
    if: ${{ needs.prepare-release.outputs.publish_requested == 'true' }}
    needs:
      - prepare-release
      - build-ios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_ref }}
          fetch-depth: 0

      - name: Fail fast when iOS publish secrets are incomplete
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_PASSWORD }}
          IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          IOS_SHARE_EXTENSION_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_P12_PASSWORD
            IOS_APPSTORE_PROVISIONING_PROFILE_BASE64
            IOS_DEVELOPMENT_TEAM
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_P8_BASE64
          )
          if [[ -d autobyteus-ios/AutoByteusMobileShareExtension ]]; then
            required+=(IOS_SHARE_EXTENSION_APPSTORE_PROVISIONING_PROFILE_BASE64)
          fi
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::iOS App Store Connect/TestFlight publish was requested, but required iOS secrets are missing: ${missing[*]}"
            echo "Configure the missing repository secrets before publishing:"
            for name in "${missing[@]}"; do
              echo "  gh secret set $name"
            done
            echo "Existing desktop APPLE_* secrets and Developer ID Application certificates are not valid iOS App Store signing inputs."
            exit 1
          fi
          {
            echo "### iOS publish secret gate"
            echo ""
            echo "All required iOS/App Store Connect secret names are present. Values were not printed."
          } >> "$GITHUB_STEP_SUMMARY"

  upload-testflight:
    name: Archive And Upload To App Store Connect
    if: ${{ needs.prepare-release.outputs.publish_requested == 'true' }}
    needs:
      - prepare-release
      - build-ios
      - publish-secret-gate
    runs-on: macos-latest
    env:
      IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_PASSWORD }}
      IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
      IOS_SHARE_EXTENSION_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_SHARE_EXTENSION_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
      IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodebuild -version

      - name: Initialize temporary publish paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "KEYCHAIN_PATH=${RUNNER_TEMP}/ios-signing.keychain-db"
            echo "CERTIFICATE_PATH=${RUNNER_TEMP}/ios-distribution-certificate.p12"
            echo "PROFILE_INSTALL_DIR=${HOME}/Library/MobileDevice/Provisioning Profiles"
            echo "ASC_KEY_DIR=${RUNNER_TEMP}/app-store-connect-private-keys"
            echo "PUBLISH_OUTPUT_DIR=${RUNNER_TEMP}/ios-publish-output"
          } >> "$GITHUB_ENV"

      - name: Import iOS distribution certificate into temporary keychain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PUBLISH_OUTPUT_DIR"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          chmod 600 "$CERTIFICATE_PATH"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$KEYCHAIN_PASSWORD" > "${RUNNER_TEMP}/ios-keychain-password.txt"
          chmod 600 "${RUNNER_TEMP}/ios-keychain-password.txt"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          existing_keychains=()
          while IFS= read -r keychain; do
            [[ -n "$keychain" ]] && existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing_keychains[@]}"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee "$PUBLISH_OUTPUT_DIR/codesigning-identities.txt"
          if ! grep -Eq 'Apple Distribution|iPhone Distribution' "$PUBLISH_OUTPUT_DIR/codesigning-identities.txt"; then
            echo "::error::Imported certificate does not expose an Apple/iOS Distribution signing identity."
            exit 1
          fi

      - name: Decode, verify, and install App Store provisioning profiles
        id: profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROFILE_INSTALL_DIR" "$PUBLISH_OUTPUT_DIR"
          APP_PROFILE_PATH="${RUNNER_TEMP}/app-store-app.mobileprovision"
          SHARE_PROFILE_PATH="${RUNNER_TEMP}/app-store-share-extension.mobileprovision"
          printf '%s' "$IOS_APPSTORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE_PATH"
          printf '%s' "$IOS_SHARE_EXTENSION_APPSTORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$SHARE_PROFILE_PATH"
          chmod 600 "$APP_PROFILE_PATH" "$SHARE_PROFILE_PATH"

          python3 autobyteus-ios/scripts/verify-appstore-profile.py \
            --profile "$APP_PROFILE_PATH" \
            --team-id "$IOS_DEVELOPMENT_TEAM" \
            --bundle-id "$IOS_BUNDLE_ID" \
            --label "app" \
            --install-dir "$PROFILE_INSTALL_DIR" \
            --json-output "$PUBLISH_OUTPUT_DIR/app-profile.json"

          python3 autobyteus-ios/scripts/verify-appstore-profile.py \
            --profile "$SHARE_PROFILE_PATH" \
            --team-id "$IOS_DEVELOPMENT_TEAM" \
            --bundle-id "$IOS_SHARE_EXTENSION_BUNDLE_ID" \
            --label "share-extension" \
            --install-dir "$PROFILE_INSTALL_DIR" \
            --json-output "$PUBLISH_OUTPUT_DIR/share-extension-profile.json"

          APP_PROFILE_NAME="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$PUBLISH_OUTPUT_DIR/app-profile.json")"
          SHARE_PROFILE_NAME="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "$PUBLISH_OUTPUT_DIR/share-extension-profile.json")"
          APP_PROFILE_UUID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["uuid"])' "$PUBLISH_OUTPUT_DIR/app-profile.json")"
          SHARE_PROFILE_UUID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["uuid"])' "$PUBLISH_OUTPUT_DIR/share-extension-profile.json")"
          {
            echo "app_profile_name=$APP_PROFILE_NAME"
            echo "share_profile_name=$SHARE_PROFILE_NAME"
            echo "app_profile_uuid=$APP_PROFILE_UUID"
            echo "share_profile_uuid=$SHARE_PROFILE_UUID"
          } >> "$GITHUB_OUTPUT"

      - name: Generate project and ExportOptions.plist
        shell: bash
        run: |
          set -euo pipefail
          autobyteus-ios/scripts/generate-project.sh 2>&1 | tee "$PUBLISH_OUTPUT_DIR/generate-project.log"
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          
          export_options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "teamID": os.environ["IOS_DEVELOPMENT_TEAM"],
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {
                  os.environ["IOS_BUNDLE_ID"]: os.environ["APP_PROFILE_NAME"],
                  os.environ["IOS_SHARE_EXTENSION_BUNDLE_ID"]: os.environ["SHARE_PROFILE_NAME"],
              },
          }
          path = Path(os.environ["EXPORT_OPTIONS"])
          path.write_bytes(plistlib.dumps(export_options, sort_keys=False))
          print(path)
          PY
        env:
          EXPORT_OPTIONS: ${{ runner.temp }}/ExportOptions.plist
          APP_PROFILE_NAME: ${{ steps.profiles.outputs.app_profile_name }}
          SHARE_PROFILE_NAME: ${{ steps.profiles.outputs.share_profile_name }}

      - name: Archive and export signed IPA
        id: archive
        shell: bash
        env:
          APP_PROFILE_NAME: ${{ steps.profiles.outputs.app_profile_name }}
          SHARE_PROFILE_NAME: ${{ steps.profiles.outputs.share_profile_name }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="${RUNNER_TEMP}/AutoByteusMobile.xcarchive"
          EXPORT_PATH="${RUNNER_TEMP}/ios-export"
          EXPORT_OPTIONS="${RUNNER_TEMP}/ExportOptions.plist"
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"
          mkdir -p "$EXPORT_PATH" "$PUBLISH_OUTPUT_DIR"

          xcodebuild \
            -project autobyteus-ios/AutoByteusMobile.xcodeproj \
            -scheme "${IOS_APP_SCHEME}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$IOS_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            IOS_BUNDLE_ID="$IOS_BUNDLE_ID" \
            IOS_SHARE_EXTENSION_BUNDLE_ID="$IOS_SHARE_EXTENSION_BUNDLE_ID" \
            MARKETING_VERSION="${{ needs.prepare-release.outputs.ios_marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ needs.prepare-release.outputs.build_number }}" \
            IOS_APPSTORE_PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_NAME" \
            IOS_SHARE_EXTENSION_APPSTORE_PROVISIONING_PROFILE_SPECIFIER="$SHARE_PROFILE_NAME" \
            archive 2>&1 | tee "$PUBLISH_OUTPUT_DIR/xcodebuild-archive.log"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            2>&1 | tee "$PUBLISH_OUTPUT_DIR/xcodebuild-export.log"

          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -type f | head -n 1 || true)"
          if [[ -z "$IPA_PATH" || ! -f "$IPA_PATH" ]]; then
            echo "::error::xcodebuild export did not produce an IPA."
            exit 1
          fi
          IPA_NAME="${IOS_ARTIFACT_PREFIX}-${{ needs.prepare-release.outputs.artifact_version }}.ipa"
          cp "$IPA_PATH" "$PUBLISH_OUTPUT_DIR/$IPA_NAME"
          (cd "$PUBLISH_OUTPUT_DIR" && shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256")
          {
            echo "ipa_path=$PUBLISH_OUTPUT_DIR/$IPA_NAME"
            echo "ipa_name=$IPA_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Upload IPA to App Store Connect/TestFlight
        id: upload
        shell: bash
        env:
          IPA_PATH: ${{ steps.archive.outputs.ipa_path }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/app-store-connect-private-keys
        run: |
          set -euo pipefail
          mkdir -p "$API_PRIVATE_KEYS_DIR" "$PUBLISH_OUTPUT_DIR"
          API_KEY_PATH="$API_PRIVATE_KEYS_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          if ! xcrun -f altool >/dev/null 2>&1; then
            echo "::error::upload_cli_unavailable: xcrun altool is unavailable on this macOS runner."
            exit 1
          fi
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee "$PUBLISH_OUTPUT_DIR/altool-upload.log"

      - name: Summarize iOS TestFlight upload
        if: always()
        shell: bash
        run: |
          {
            echo "### iOS App Store Connect/TestFlight publish"
            echo ""
            echo "Release tag: \`${{ needs.prepare-release.outputs.release_tag }}\`"
            echo "Checked-out SHA: \`${{ needs.prepare-release.outputs.release_sha }}\`"
            echo "iOS marketing/build: \`${{ needs.prepare-release.outputs.ios_marketing_version }} (${{ needs.prepare-release.outputs.build_number }})\`"
            echo "Artifact version: \`${{ needs.prepare-release.outputs.artifact_version }}\`"
            echo "Prerelease label: \`${{ needs.prepare-release.outputs.prerelease_label || 'none' }}\`"
            echo "Bundle ID: \`${IOS_BUNDLE_ID}\`"
            echo "Share extension bundle ID: \`${IOS_SHARE_EXTENSION_BUNDLE_ID}\`"
            echo "Team ID: \`${IOS_DEVELOPMENT_TEAM}\`"
            echo "App profile UUID/name: \`${{ steps.profiles.outputs.app_profile_uuid }} / ${{ steps.profiles.outputs.app_profile_name }}\`"
            echo "Share profile UUID/name: \`${{ steps.profiles.outputs.share_profile_uuid }} / ${{ steps.profiles.outputs.share_profile_name }}\`"
            echo "IPA: \`${{ steps.archive.outputs.ipa_name || 'not exported' }}\`"
            echo "Upload step status: \`${{ steps.upload.outcome || 'not reached' }}\`"
            echo ""
            echo "This workflow uploads to App Store Connect/TestFlight only. It does not submit for final App Store review or public release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup iOS signing material
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -d "${PUBLISH_OUTPUT_DIR:-}" ]]; then
            for profile_json in "$PUBLISH_OUTPUT_DIR"/*profile.json; do
              [[ -f "$profile_json" ]] || continue
              installed_path="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("installedPath",""))' "$profile_json" 2>/dev/null || true)"
              case "$installed_path" in
                "$HOME/Library/MobileDevice/Provisioning Profiles/"*) rm -f "$installed_path" ;;
              esac
            done
          fi
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1
          rm -f "$CERTIFICATE_PATH" "${RUNNER_TEMP}/ios-keychain-password.txt"
          rm -rf "$ASC_KEY_DIR"

      - name: Upload iOS publish artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-store-connect-artifacts
          path: |
            ${{ runner.temp }}/ios-publish-output/**
            ${{ runner.temp }}/ExportOptions.plist
          if-no-files-found: warn
          retention-days: 14
