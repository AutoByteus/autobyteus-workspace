name: Server Docker Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (example: v1.2.7 or v1.2.7-beta.1). Omit it with build_only."
        required: false
        type: string
      release_ref:
        description: "Git ref to build from during manual dispatch (branch, tag, or SHA). Defaults to release_tag when omitted, or to the dispatched branch with build_only."
        required: false
        type: string
      image_name:
        description: "Docker image name override (default: autobyteus/autobyteus-server)"
        required: false
        type: string
      publish_zh:
        description: "Publish only the zh runtime variant during manual dispatch"
        required: false
        default: false
        type: boolean
      build_only:
        description: "Build and check both architectures and packages; publish nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# A build-only run has its own group, so it never waits for or blocks a release run.
concurrency:
  group: ${{ github.event.inputs.build_only == 'true' && format('server-docker-build-only-{0}', github.run_id) || format('server-docker-release-{0}', github.event.inputs.release_tag || github.ref_name) }}
  cancel-in-progress: false

env:
  DEFAULT_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME || 'autobyteus/autobyteus-server' }}

jobs:
  prepare-release:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      build_only: ${{ steps.meta.outputs.build_only }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_ref: ${{ steps.meta.outputs.release_ref }}
      image_name: ${{ steps.meta.outputs.image_name }}
      normalized_tag: ${{ steps.meta.outputs.normalized_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      variant_label: ${{ steps.meta.outputs.variant_label }}
      build_variant: ${{ steps.meta.outputs.build_variant }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Resolve publish metadata
        id: meta
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
          INPUT_RELEASE_REF: ${{ github.event.inputs.release_ref || '' }}
          INPUT_IMAGE_NAME: ${{ github.event.inputs.image_name || '' }}
          INPUT_PUBLISH_ZH: ${{ github.event.inputs.publish_zh || 'false' }}
          INPUT_BUILD_ONLY: ${{ github.event.inputs.build_only || 'false' }}
        run: |
          set -euo pipefail

          BUILD_ONLY="false"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_BUILD_ONLY}" == "true" ]]; then
            BUILD_ONLY="true"
          fi

          if [[ "${BUILD_ONLY}" == "true" ]]; then
            if [[ -n "${INPUT_RELEASE_TAG}" ]]; then
              echo "::error::A build-only run publishes nothing; omit release_tag."
              exit 1
            fi
            RELEASE_TAG=""
            RELEASE_REF="${INPUT_RELEASE_REF:-${GITHUB_REF_NAME}}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_REF="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${INPUT_RELEASE_TAG}"
            if [[ -n "${INPUT_RELEASE_REF}" ]]; then
              RELEASE_REF="${INPUT_RELEASE_REF}"
            else
              RELEASE_REF="${INPUT_RELEASE_TAG}"
            fi
          fi

          if [[ "${BUILD_ONLY}" != "true" ]]; then
            if [[ -z "${RELEASE_TAG}" ]]; then
              echo "::error::release_tag is required for manual workflow dispatch."
              exit 1
            fi

            if [[ ! "${RELEASE_TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Invalid release tag '${RELEASE_TAG}'. Expected format like v1.2.7 or v1.2.7-rc1."
              exit 1
            fi
          fi

          IMAGE_NAME="${INPUT_IMAGE_NAME:-$DEFAULT_IMAGE_NAME}"
          NORMALIZED_TAG="${RELEASE_TAG#v}"
          IS_PRERELEASE="false"
          BUILD_VARIANT=""
          VARIANT_LABEL="default"
          VERSION_SUFFIX=""
          LATEST_TAG="latest"
          if [[ "${NORMALIZED_TAG}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_PUBLISH_ZH}" == "true" ]]; then
            BUILD_VARIANT="zh"
            VARIANT_LABEL="zh"
            VERSION_SUFFIX="-zh"
            LATEST_TAG="latest-zh"
          fi

          # The version tag is the first published tag; a build-only run publishes no tag.
          VERSION_TAG=""
          if [[ "${BUILD_ONLY}" != "true" ]]; then
            VERSION_TAG="${IMAGE_NAME}:${NORMALIZED_TAG}${VERSION_SUFFIX}"
          fi

          {
            echo "build_only=${BUILD_ONLY}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_ref=${RELEASE_REF}"
            echo "image_name=${IMAGE_NAME}"
            echo "normalized_tag=${NORMALIZED_TAG}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "variant_label=${VARIANT_LABEL}"
            echo "build_variant=${BUILD_VARIANT}"
            echo "version_tag=${VERSION_TAG}"
            echo "tags<<EOF"
            if [[ "${BUILD_ONLY}" != "true" ]]; then
              echo "${VERSION_TAG}"
              if [[ "${IS_PRERELEASE}" != "true" ]]; then
                echo "${IMAGE_NAME}:${LATEST_TAG}"
              fi
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Summarize publish plan
        env:
          BUILD_ONLY: ${{ steps.meta.outputs.build_only }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_REF: ${{ steps.meta.outputs.release_ref }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          VARIANT_LABEL: ${{ steps.meta.outputs.variant_label }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Server Docker publish plan"
            echo ""
            if [[ "${BUILD_ONLY}" == "true" ]]; then
              echo "Build only: nothing is published."
              echo ""
              echo "Release ref: \`${RELEASE_REF}\`"
              echo "Image: \`${IMAGE_NAME}\`"
              echo "Variant: \`${VARIANT_LABEL}\`"
            else
              echo "Release tag: \`${RELEASE_TAG}\`"
              echo "Release ref: \`${RELEASE_REF}\`"
              echo "Image: \`${IMAGE_NAME}\`"
              echo "Variant: \`${VARIANT_LABEL}\`"
              echo "Prerelease: \`${IS_PRERELEASE}\`"
              echo ""
              echo "Published tags:"
              echo "${TAGS}" | sed 's/^/- `/' | sed 's/$/`/'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # Builds one architecture natively on its own runner and pushes it untagged, by digest.
  # Nothing is tagged here: Publish Server Image tags both digests once both legs succeeded.
  build:
    name: Build Server Image (${{ matrix.platform }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_ref }}
          fetch-depth: 1

      - name: Check licensing consistency
        run: python3 scripts/check_licensing.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails when the image's system part changed without a new system level, and picks the
      # pinned base image digest of this run's variant from system-level.json.
      - name: Check system level
        id: system_level
        env:
          VARIANT_LABEL: ${{ needs.prepare-release.outputs.variant_label }}
          RELEASE_REF: ${{ needs.prepare-release.outputs.release_ref }}
        run: |
          set -euo pipefail

          LEVEL_FILE="autobyteus-server-ts/docker/system-level.json"
          if [[ ! -f "${LEVEL_FILE}" ]]; then
            VARIANT_INPUT=""
            if [[ "${VARIANT_LABEL}" == "zh" ]]; then
              VARIANT_INPUT=" -f publish_zh=true"
            fi
            echo "::error::${RELEASE_REF} predates server packages (no ${LEVEL_FILE}). Re-publish it with the workflow of that ref: gh workflow run release-server-docker.yml --ref ${RELEASE_REF} -f release_tag=<tag>${VARIANT_INPUT}"
            exit 1
          fi

          node scripts/server-package/check-system-level.mjs
          DIGEST="$(jq -r --arg variant "${VARIANT_LABEL}" '.baseImages[$variant] // empty' "${LEVEL_FILE}")"
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::${LEVEL_FILE} has no base image digest for the variant '${VARIANT_LABEL}'."
            exit 1
          fi
          echo "base_image_digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      # One image of about 2.4 GB needs far less than a runner's usual free disk; clean up
      # only when a runner image comes with less than 30 GB free.
      - name: Free runner disk space when low
        run: |
          set -euo pipefail
          FREE_GB="$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')"
          echo "Free disk on /: ${FREE_GB} GB"
          if (( FREE_GB >= 30 )); then
            exit 0
          fi
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # With provenance and SBOM off, the digest is this architecture's image manifest.
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: autobyteus-server-ts/docker/Dockerfile.monorepo
          build-args: |
            BASE_IMAGE_DIGEST=${{ steps.system_level.outputs.base_image_digest }}
            CLI_INSTALL_CACHE_BUSTER=${{ github.run_id }}
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ needs.prepare-release.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the image digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${DIGEST}" > "${RUNNER_TEMP}/digests/${ARCH}"
          echo "Pushed ${ARCH} image ${DIGEST}"

      # The artifact stays in the run: `gh run rerun --failed` rebuilds only a failed leg, and
      # Publish Server Image then reads this leg's earlier digest.
      - name: Upload the image digest
        uses: actions/upload-artifact@v4
        with:
          name: server-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Makes the multi-arch image from both legs' digests. It checks a dry-run index of exactly
  # those two digests before pushing any tag, then the pushed version tag again, and hands the
  # checked digests to the package jobs. A build-only run stops after the dry-run check.
  publish-image:
    name: Publish Server Image
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    outputs:
      amd64_digest: ${{ steps.index.outputs.amd64_digest }}
      arm64_digest: ${{ steps.index.outputs.arm64_digest }}
    steps:
      - name: Download the image digests
        uses: actions/download-artifact@v4
        with:
          pattern: server-image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and check the multi-arch image
        id: index
        env:
          BUILD_ONLY: ${{ needs.prepare-release.outputs.build_only }}
          IMAGE_NAME: ${{ needs.prepare-release.outputs.image_name }}
          VERSION_TAG: ${{ needs.prepare-release.outputs.version_tag }}
          TAGS: ${{ needs.prepare-release.outputs.tags }}
        run: |
          set -euo pipefail

          AMD64_DIGEST="$(cat "${RUNNER_TEMP}/digests/amd64")"
          ARM64_DIGEST="$(cat "${RUNNER_TEMP}/digests/arm64")"
          SOURCES=("${IMAGE_NAME}@${AMD64_DIGEST}" "${IMAGE_NAME}@${ARM64_DIGEST}")
          EXPECTED="$(printf 'linux/amd64 %s\nlinux/arm64 %s' "${AMD64_DIGEST}" "${ARM64_DIGEST}")"

          # Fails unless the index lists exactly linux/amd64 -> the amd64 digest and
          # linux/arm64 -> the arm64 digest.
          check_index() {
            local index_file="$1" label="$2" listed
            listed="$(jq -r '(.manifests // [])[] | "\(.platform.os)/\(.platform.architecture) \(.digest)"' "${index_file}" | sort)"
            if [[ "${listed}" != "${EXPECTED}" ]]; then
              echo "::error::The ${label} index does not list exactly linux/amd64 ${AMD64_DIGEST} and linux/arm64 ${ARM64_DIGEST}. It lists: ${listed//$'\n'/, }"
              exit 1
            fi
            echo "The ${label} index lists linux/amd64 ${AMD64_DIGEST} and linux/arm64 ${ARM64_DIGEST}."
          }

          docker buildx imagetools create --dry-run -t "${VERSION_TAG:-${IMAGE_NAME}:build-only}" "${SOURCES[@]}" \
            > "${RUNNER_TEMP}/dry-run-index.json"
          check_index "${RUNNER_TEMP}/dry-run-index.json" "dry-run"

          if [[ "${BUILD_ONLY}" != "true" ]]; then
            TAG_ARGS=()
            while IFS= read -r tag; do
              if [[ -n "${tag}" ]]; then
                TAG_ARGS+=(-t "${tag}")
              fi
            done <<< "${TAGS}"
            docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"
            docker buildx imagetools inspect --raw "${VERSION_TAG}" > "${RUNNER_TEMP}/pushed-index.json"
            check_index "${RUNNER_TEMP}/pushed-index.json" "pushed ${VERSION_TAG}"
          fi

          {
            echo "amd64_digest=${AMD64_DIGEST}"
            echo "arm64_digest=${ARM64_DIGEST}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish summary
        env:
          BUILD_ONLY: ${{ needs.prepare-release.outputs.build_only }}
          IMAGE_NAME: ${{ needs.prepare-release.outputs.image_name }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          VARIANT_LABEL: ${{ needs.prepare-release.outputs.variant_label }}
          IS_PRERELEASE: ${{ needs.prepare-release.outputs.is_prerelease }}
          TAGS: ${{ needs.prepare-release.outputs.tags }}
          AMD64_DIGEST: ${{ steps.index.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.index.outputs.arm64_digest }}
        run: |
          {
            if [[ "${BUILD_ONLY}" == "true" ]]; then
              echo "### Server Docker image built (build only: nothing published)"
            else
              echo "### Server Docker image published"
            fi
            echo ""
            echo "Image: \`${IMAGE_NAME}\`"
            if [[ "${BUILD_ONLY}" != "true" ]]; then
              echo "Release tag: \`${RELEASE_TAG}\`"
            fi
            echo "Variant: \`${VARIANT_LABEL}\`"
            if [[ "${BUILD_ONLY}" != "true" ]]; then
              echo "Prerelease: \`${IS_PRERELEASE}\`"
            fi
            echo ""
            echo "Checked images:"
            echo "- \`linux/amd64\`: \`${AMD64_DIGEST}\`"
            echo "- \`linux/arm64\`: \`${ARM64_DIGEST}\`"
            if [[ "${BUILD_ONLY}" != "true" ]]; then
              echo ""
              echo "Published tags:"
              echo "${TAGS}" | sed 's/^/- `/' | sed 's/$/`/'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      # Move beta tag needs the tag list and this workflow's revision; only commits are fetched.
      - name: Checkout tags for the beta decision
        if: ${{ needs.prepare-release.outputs.build_variant == '' && needs.prepare-release.outputs.build_only != 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: scripts

      # Moves the forward-only `beta` tag to the version image just pushed, but only
      # when this tag is the newest recognized release tag. Deciding after both architecture
      # builds (with freshly fetched tags) lets a later concurrent release win.
      - name: Move beta tag
        if: ${{ needs.prepare-release.outputs.build_variant == '' && needs.prepare-release.outputs.build_only != 'true' }}
        env:
          IMAGE_NAME: ${{ needs.prepare-release.outputs.image_name }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          NORMALIZED_TAG: ${{ needs.prepare-release.outputs.normalized_tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin

          # Load the helper from this workflow's revision: a re-published older
          # release_ref checkout may predate scripts/release_versions.py.
          HELPER="${RUNNER_TEMP}/release_versions.py"
          git show "${GITHUB_SHA}:scripts/release_versions.py" > "${HELPER}"

          IS_NEWEST="$(python3 "${HELPER}" is-newest "${RELEASE_TAG}")"
          if [[ "${IS_NEWEST}" == "true" ]]; then
            docker buildx imagetools create -t "${IMAGE_NAME}:beta" "${IMAGE_NAME}:${NORMALIZED_TAG}"
            DECISION="Moved \`${IMAGE_NAME}:beta\` to \`${IMAGE_NAME}:${NORMALIZED_TAG}\`."
          else
            DECISION="Left \`${IMAGE_NAME}:beta\` unchanged: \`${RELEASE_TAG}\` is not the newest recognized release tag."
          fi

          echo "${DECISION}"
          {
            echo ""
            echo "### Beta tag"
            echo ""
            echo "${DECISION}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Takes the built-in server package out of the architecture image whose digest Publish Server
  # Image checked against the version tag's index, so the published package is the image's own,
  # then describes, signs and uploads it to the release. A build-only run signs it and stops.
  # The zh variant publishes no package: its nodes update from the default variant's packages.
  publish-server-package:
    name: Publish Server Package (${{ matrix.platform }})
    needs: [prepare-release, publish-image]
    if: ${{ needs.prepare-release.outputs.build_variant == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            package_arch: x64
          - platform: linux/arm64
            arch: arm64
            package_arch: arm64
    steps:
      - name: Checkout the package scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/server-package
            autobyteus-server-ts/docker

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # One image of about 2.4 GB needs far less than a runner's usual free disk; clean up
      # only when a runner image comes with less than 30 GB free.
      - name: Free runner disk space when low
        run: |
          set -euo pipefail
          FREE_GB="$(df -BG --output=avail / | tail -n 1 | tr -dc '0-9')"
          echo "Free disk on /: ${FREE_GB} GB"
          if (( FREE_GB >= 30 )); then
            exit 0
          fi
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Extract the built-in server package
        env:
          IMAGE_NAME: ${{ needs.prepare-release.outputs.image_name }}
          DIGEST: ${{ needs.publish-image.outputs[format('{0}_digest', matrix.arch)] }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          docker create --platform "${PLATFORM}" --name server-package-source "${IMAGE_NAME}@${DIGEST}" >/dev/null
          docker cp server-package-source:/opt/autobyteus/server-package "${RUNNER_TEMP}/server-package"
          docker rm server-package-source >/dev/null

      - name: Archive, describe and sign the server package
        id: package
        env:
          BUILD_ONLY: ${{ needs.prepare-release.outputs.build_only }}
          NORMALIZED_TAG: ${{ needs.prepare-release.outputs.normalized_tag }}
          PACKAGE_ARCH: ${{ matrix.package_arch }}
          SERVER_PACKAGE_SIGNING_KEY: ${{ secrets.SERVER_PACKAGE_SIGNING_KEY }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="${RUNNER_TEMP}/server-package"
          ASSET_DIR="${RUNNER_TEMP}/server-package-assets"
          mkdir -p "${ASSET_DIR}"
          ARCH="$(node -p 'require(process.argv[1]).arch' "${PACKAGE_DIR}/server-package.json")"
          if [[ "${ARCH}" != "${PACKAGE_ARCH}" ]]; then
            echo "::error::The image's server package is for '${ARCH}', not '${PACKAGE_ARCH}'; nothing was published."
            exit 1
          fi
          # A build-only run has no release tag; the package's own version passes the same check.
          if [[ "${BUILD_ONLY}" == "true" ]]; then
            VERSION="$(node -p 'require(process.argv[1]).version' "${PACKAGE_DIR}/server-package.json")"
          else
            VERSION="${NORMALIZED_TAG}"
          fi
          ASSET_BASE="${ASSET_DIR}/autobyteus-server-${VERSION}-linux-${ARCH}"

          tar --sort=name --owner=0 --group=0 --numeric-owner -C "${PACKAGE_DIR}" -cf - . | gzip -n > "${ASSET_BASE}.tar.gz"
          node scripts/server-package/describe-server-package.mjs description \
            --package-dir "${PACKAGE_DIR}" \
            --archive "${ASSET_BASE}.tar.gz" \
            --version "${VERSION}" \
            --out "${ASSET_BASE}.json"
          node scripts/server-package/sign-server-package.mjs \
            --description "${ASSET_BASE}.json" \
            --public-key autobyteus-server-ts/docker/server-package-signing-key.pem
          echo "asset_base=${ASSET_BASE}" >> "${GITHUB_OUTPUT}"

      # The Desktop Release or the Android APK Release workflow creates the GitHub release,
      # whichever gets there first; wait for it (up to 60 minutes, as long as the Desktop
      # Release waits for these files).
      - name: Wait for the GitHub release
        if: ${{ needs.prepare-release.outputs.build_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 120); do
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::The GitHub release ${RELEASE_TAG} did not appear within 60 minutes; the server package was not published."
          exit 1

      # Archive first, then the description, then its signature. When a re-publish replaces them
      # (--clobber), a node that reads the new description and signature always finds the new
      # archive; one that read the old pair gets ARCHIVE_MISMATCH once, and a retry succeeds.
      - name: Upload the server package to the release
        if: ${{ needs.prepare-release.outputs.build_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          ASSET_BASE: ${{ steps.package.outputs.asset_base }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          for suffix in .tar.gz .json .json.sig; do
            gh release upload "${RELEASE_TAG}" "${ASSET_BASE}${suffix}" --clobber
          done
          {
            echo "### Server package (${PLATFORM})"
            echo ""
            for suffix in .tar.gz .json .json.sig; do
              echo "- \`$(basename "${ASSET_BASE}${suffix}")\`"
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Summarize the build-only server package
        if: ${{ needs.prepare-release.outputs.build_only == 'true' }}
        env:
          ASSET_BASE: ${{ steps.package.outputs.asset_base }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          ARCHIVE="$(node -p 'const a = require(process.argv[1]).archive; a.sha256 + " " + a.size' "${ASSET_BASE}.json")"
          {
            echo "### Server package (${PLATFORM}), build only: not uploaded"
            echo ""
            for suffix in .tar.gz .json .json.sig; do
              echo "- \`$(basename "${ASSET_BASE}${suffix}")\`"
            done
            echo ""
            echo "Archive SHA-256: \`${ARCHIVE% *}\`, size: ${ARCHIVE#* } bytes"
          } >> "${GITHUB_STEP_SUMMARY}"
