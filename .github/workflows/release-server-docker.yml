name: Server Docker Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (example: v1.2.7 or v1.2.7-beta.1)"
        required: false
        type: string
      release_ref:
        description: "Git ref to build from during manual dispatch (branch, tag, or SHA). Defaults to release_tag when omitted."
        required: false
        type: string
      image_name:
        description: "Docker image name override (default: autobyteus/autobyteus-server)"
        required: false
        type: string
      publish_zh:
        description: "Publish only the zh runtime variant during manual dispatch"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: server-docker-release-${{ github.event.inputs.release_tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  DEFAULT_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME || 'autobyteus/autobyteus-server' }}

jobs:
  prepare-release:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_ref: ${{ steps.meta.outputs.release_ref }}
      image_name: ${{ steps.meta.outputs.image_name }}
      normalized_tag: ${{ steps.meta.outputs.normalized_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      variant_label: ${{ steps.meta.outputs.variant_label }}
      build_variant: ${{ steps.meta.outputs.build_variant }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Resolve publish metadata
        id: meta
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
          INPUT_RELEASE_REF: ${{ github.event.inputs.release_ref || '' }}
          INPUT_IMAGE_NAME: ${{ github.event.inputs.image_name || '' }}
          INPUT_PUBLISH_ZH: ${{ github.event.inputs.publish_zh || 'false' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_REF="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${INPUT_RELEASE_TAG}"
            if [[ -n "${INPUT_RELEASE_REF}" ]]; then
              RELEASE_REF="${INPUT_RELEASE_REF}"
            else
              RELEASE_REF="${INPUT_RELEASE_TAG}"
            fi
          fi

          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::release_tag is required for manual workflow dispatch."
            exit 1
          fi

          if [[ ! "${RELEASE_TAG}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release tag '${RELEASE_TAG}'. Expected format like v1.2.7 or v1.2.7-rc1."
            exit 1
          fi

          IMAGE_NAME="${INPUT_IMAGE_NAME:-$DEFAULT_IMAGE_NAME}"
          NORMALIZED_TAG="${RELEASE_TAG#v}"
          IS_PRERELEASE="false"
          BUILD_VARIANT=""
          VARIANT_LABEL="default"
          VERSION_SUFFIX=""
          LATEST_TAG="latest"
          if [[ "${NORMALIZED_TAG}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_PUBLISH_ZH}" == "true" ]]; then
            BUILD_VARIANT="zh"
            VARIANT_LABEL="zh"
            VERSION_SUFFIX="-zh"
            LATEST_TAG="latest-zh"
          fi

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_ref=${RELEASE_REF}"
            echo "image_name=${IMAGE_NAME}"
            echo "normalized_tag=${NORMALIZED_TAG}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "variant_label=${VARIANT_LABEL}"
            echo "build_variant=${BUILD_VARIANT}"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${NORMALIZED_TAG}${VERSION_SUFFIX}"
            if [[ "${IS_PRERELEASE}" != "true" ]]; then
              echo "${IMAGE_NAME}:${LATEST_TAG}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Summarize publish plan
        run: |
          {
            echo "### Server Docker publish plan"
            echo ""
            echo "Release tag: \`${{ steps.meta.outputs.release_tag }}\`"
            echo "Release ref: \`${{ steps.meta.outputs.release_ref }}\`"
            echo "Image: \`${{ steps.meta.outputs.image_name }}\`"
            echo "Variant: \`${{ steps.meta.outputs.variant_label }}\`"
            echo "Prerelease: \`${{ steps.meta.outputs.is_prerelease }}\`"
            echo ""
            echo "Published tags:"
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "${GITHUB_STEP_SUMMARY}"

  build-and-push:
    name: Build And Push Server Image
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_ref }}
          fetch-depth: 0

      - name: Check licensing consistency
        run: python3 scripts/check_licensing.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails when the image's system part changed without a new system level, and picks the
      # pinned base image digest of this run's variant from system-level.json.
      - name: Check system level
        id: system_level
        env:
          VARIANT_LABEL: ${{ needs.prepare-release.outputs.variant_label }}
          RELEASE_REF: ${{ needs.prepare-release.outputs.release_ref }}
        run: |
          set -euo pipefail

          LEVEL_FILE="autobyteus-server-ts/docker/system-level.json"
          if [[ ! -f "${LEVEL_FILE}" ]]; then
            VARIANT_INPUT=""
            if [[ "${VARIANT_LABEL}" == "zh" ]]; then
              VARIANT_INPUT=" -f publish_zh=true"
            fi
            echo "::error::${RELEASE_REF} predates server packages (no ${LEVEL_FILE}). Re-publish it with the workflow of that ref: gh workflow run release-server-docker.yml --ref ${RELEASE_REF} -f release_tag=<tag>${VARIANT_INPUT}"
            exit 1
          fi

          node scripts/server-package/check-system-level.mjs
          DIGEST="$(jq -r --arg variant "${VARIANT_LABEL}" '.baseImages[$variant] // empty' "${LEVEL_FILE}")"
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::${LEVEL_FILE} has no base image digest for the variant '${VARIANT_LABEL}'."
            exit 1
          fi
          echo "base_image_digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Free runner disk space
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push default multi-arch image
        if: ${{ needs.prepare-release.outputs.build_variant == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: autobyteus-server-ts/docker/Dockerfile.monorepo
          build-args: |
            BASE_IMAGE_DIGEST=${{ steps.system_level.outputs.base_image_digest }}
            CLI_INSTALL_CACHE_BUSTER=${{ github.run_id }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release-server-docker-default
          cache-to: type=gha,mode=max,scope=release-server-docker-default
          tags: ${{ needs.prepare-release.outputs.tags }}

      - name: Build and push zh multi-arch image
        if: ${{ needs.prepare-release.outputs.build_variant == 'zh' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: autobyteus-server-ts/docker/Dockerfile.monorepo
          build-args: |
            BASE_IMAGE_DIGEST=${{ steps.system_level.outputs.base_image_digest }}
            CLI_INSTALL_CACHE_BUSTER=${{ github.run_id }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release-server-docker-zh
          cache-to: type=gha,mode=max,scope=release-server-docker-zh
          tags: ${{ needs.prepare-release.outputs.tags }}

      - name: Publish summary
        run: |
          {
            echo "### Server Docker image published"
            echo ""
            echo "Image: \`${{ needs.prepare-release.outputs.image_name }}\`"
            echo "Release tag: \`${{ needs.prepare-release.outputs.release_tag }}\`"
            echo "Variant: \`${{ needs.prepare-release.outputs.variant_label }}\`"
            echo "Prerelease: \`${{ needs.prepare-release.outputs.is_prerelease }}\`"
            echo ""
            echo "Published tags:"
            echo "${{ needs.prepare-release.outputs.tags }}" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Moves the forward-only `beta` tag to the version image just pushed, but only
      # when this tag is the newest recognized release tag. Deciding after the long
      # build (with freshly fetched tags) lets a later concurrent release win.
      - name: Move beta tag
        if: ${{ needs.prepare-release.outputs.build_variant == '' }}
        env:
          IMAGE_NAME: ${{ needs.prepare-release.outputs.image_name }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          NORMALIZED_TAG: ${{ needs.prepare-release.outputs.normalized_tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin

          # Load the helper from this workflow's revision: a re-published older
          # release_ref checkout may predate scripts/release_versions.py.
          HELPER="${RUNNER_TEMP}/release_versions.py"
          git show "${GITHUB_SHA}:scripts/release_versions.py" > "${HELPER}"

          IS_NEWEST="$(python3 "${HELPER}" is-newest "${RELEASE_TAG}")"
          if [[ "${IS_NEWEST}" == "true" ]]; then
            docker buildx imagetools create -t "${IMAGE_NAME}:beta" "${IMAGE_NAME}:${NORMALIZED_TAG}"
            DECISION="Moved \`${IMAGE_NAME}:beta\` to \`${IMAGE_NAME}:${NORMALIZED_TAG}\`."
          else
            DECISION="Left \`${IMAGE_NAME}:beta\` unchanged: \`${RELEASE_TAG}\` is not the newest recognized release tag."
          fi

          echo "${DECISION}"
          {
            echo ""
            echo "### Beta tag"
            echo ""
            echo "${DECISION}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Takes the built-in server package out of the pushed image for each architecture, so the
  # published package is the image's own, then describes, signs and uploads it to the release.
  # The zh variant publishes no package: its nodes update from the default variant's packages.
  publish-server-package:
    name: Publish Server Package (${{ matrix.platform }})
    needs: [prepare-release, build-and-push]
    if: ${{ needs.prepare-release.outputs.build_variant == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.release_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Free runner disk space
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Extract the built-in server package
        env:
          IMAGE: ${{ needs.prepare-release.outputs.image_name }}:${{ needs.prepare-release.outputs.normalized_tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          docker create --platform "${PLATFORM}" --name server-package-source "${IMAGE}" >/dev/null
          docker cp server-package-source:/opt/autobyteus/server-package "${RUNNER_TEMP}/server-package"
          docker rm server-package-source >/dev/null

      - name: Archive, describe and sign the server package
        id: package
        env:
          NORMALIZED_TAG: ${{ needs.prepare-release.outputs.normalized_tag }}
          SERVER_PACKAGE_SIGNING_KEY: ${{ secrets.SERVER_PACKAGE_SIGNING_KEY }}
        run: |
          set -euo pipefail

          PACKAGE_DIR="${RUNNER_TEMP}/server-package"
          ASSET_DIR="${RUNNER_TEMP}/server-package-assets"
          mkdir -p "${ASSET_DIR}"
          ARCH="$(node -p 'require(process.argv[1]).arch' "${PACKAGE_DIR}/server-package.json")"
          ASSET_BASE="${ASSET_DIR}/autobyteus-server-${NORMALIZED_TAG}-linux-${ARCH}"

          tar --sort=name --owner=0 --group=0 --numeric-owner -C "${PACKAGE_DIR}" -cf - . | gzip -n > "${ASSET_BASE}.tar.gz"
          node scripts/server-package/describe-server-package.mjs description \
            --package-dir "${PACKAGE_DIR}" \
            --archive "${ASSET_BASE}.tar.gz" \
            --version "${NORMALIZED_TAG}" \
            --out "${ASSET_BASE}.json"
          node scripts/server-package/sign-server-package.mjs \
            --description "${ASSET_BASE}.json" \
            --public-key autobyteus-server-ts/docker/server-package-signing-key.pem
          echo "asset_base=${ASSET_BASE}" >> "${GITHUB_OUTPUT}"

      # The Desktop Release or the Android APK Release workflow creates the GitHub release,
      # whichever gets there first; wait for it (up to 30 minutes).
      - name: Wait for the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 60); do
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::The GitHub release ${RELEASE_TAG} did not appear within 30 minutes; the server package was not published."
          exit 1

      # Archive first, then the description, then its signature. When a re-publish replaces them
      # (--clobber), a node that reads the new description and signature always finds the new
      # archive; one that read the old pair gets ARCHIVE_MISMATCH once, and a retry succeeds.
      - name: Upload the server package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          ASSET_BASE: ${{ steps.package.outputs.asset_base }}
        run: |
          set -euo pipefail

          for suffix in .tar.gz .json .json.sig; do
            gh release upload "${RELEASE_TAG}" "${ASSET_BASE}${suffix}" --clobber
          done
          {
            echo "### Server package (${{ matrix.platform }})"
            echo ""
            for suffix in .tar.gz .json .json.sig; do
              echo "- \`$(basename "${ASSET_BASE}${suffix}")\`"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
