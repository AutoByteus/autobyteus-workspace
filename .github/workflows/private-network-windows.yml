name: Private Network hand-over (Windows)

# autobyteus-661 AR-005: on Windows the network program hands each private-network connection to the node over a named
# pipe. This runs the hand-over tests on a Windows runner (nobody on the team has a Windows device); macOS and Linux run
# them in the server unit suite.

on:
  push:
    branches:
      - "codex/autobyteus-661-**"
    paths:
      - "autobyteus-server-ts/src/private-network/private-network-listener.ts"
      - "autobyteus-server-ts/tests/unit/private-network/private-network-listener.test.ts"
      - ".github/workflows/private-network-windows.yml"
  pull_request:
    paths:
      - "autobyteus-server-ts/src/private-network/private-network-listener.ts"
      - "autobyteus-server-ts/tests/unit/private-network/private-network-listener.test.ts"
      - ".github/workflows/private-network-windows.yml"

permissions:
  contents: read

jobs:
  hand-over:
    name: Caller hand-over over a named pipe
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout workspace + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare the server sources
        run: pnpm -C autobyteus-server-ts prepare:source

      - name: Run the hand-over tests
        run: pnpm -C autobyteus-server-ts exec vitest run tests/unit/private-network/private-network-listener.test.ts --no-watch --reporter=verbose
