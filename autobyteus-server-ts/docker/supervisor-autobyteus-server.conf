[program:autobyteus_server]
; The starter chooses and runs the node's server package; it exits with the server's exit code, so
; supervisord restarts it as it restarted the server. On stop it forwards SIGTERM to the server and
; waits for it: stopwaitsecs is above the server's own bounded shutdown (10 s cleanup plus its
; process-tree sweep).
command=/bin/bash -lc 'exec node /opt/autobyteus/starter/starter.mjs'
directory=/opt/autobyteus/starter
stopwaitsecs=30
user=root
autostart=true
autorestart=true
startsecs=3
startretries=20
priority=500
stdout_logfile=/var/log/supervisor/autobyteus_server.log
stderr_logfile=/var/log/supervisor/autobyteus_server.err.log
environment=HOME="/root",USER="root",NODE_ENV="production",BROWSER="/usr/local/bin/open-vnc-browser-url.sh"
