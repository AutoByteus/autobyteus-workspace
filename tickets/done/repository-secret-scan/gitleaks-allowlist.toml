# gitleaks config with the confirmed false positives from the
# repository-secret-scan ticket (2026-10-20). It holds no secret values.
#
# Usage, from the repository root:
#   gitleaks git . --redact -c tickets/done/repository-secret-scan/gitleaks-allowlist.toml
#
# Each allowlist below names a class of value that was checked by shape and
# context and is not a credential. Add a class only after the same check;
# never allowlist a value because it is inconvenient.

title = "autobyteus-workspace gitleaks config (default rules + confirmed false positives)"

[extend]
useDefault = true

# Hashes, IDs and nonces. These are file pins, run/agent IDs and websocket
# handshake keys in ticket evidence.
[[allowlists]]
description = "sha256 / sha1 / 32-hex digests and UUIDs"
regexTarget = "secret"
regexes = [
  '''^[0-9a-f]{64}$''',
  '''^[0-9a-f]{40}$''',
  '''^[0-9a-f]{32}$''',
  '''^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$''',
]

# Context-only false positives: websocket handshake keys, the local dev server's
# websocket token on 127.0.0.1, LLM response signatures, and code references to
# key variables (not their values).
[[allowlists]]
description = "Handshake keys, localhost dev-server tokens, LLM signatures, env-var references"
regexTarget = "line"
regexes = [
  '''(?i)"sec-websocket-(key|accept)"\s*:''',
  '''ws://(127\.0\.0\.1|localhost):\d+/?\?token=''',
  '''"signature"\s*:''',
  '''process\.env\.[A-Z0-9_]+''',
]

# Obvious test values used by fixtures and canary scans.
[[allowlists]]
description = "Synthetic fixture and canary values"
regexTarget = "secret"
regexes = [
  '''(?i)(synthetic|canary|placeholder|replace_with|example|dummy|fake)''',
  '''^(sk-)?1234567890abcdefghijklmnop$''',
]

# Vendored third-party bundles.
[[allowlists]]
description = "Vendored Monaco editor assets"
paths = [
  '''autobyteus-web-prototype/public/prototype-assets/monaco/''',
]

# SF-001: Telegram bot token in a generated messaging-gateway config, committed
# in c798a7e70c and removed in 46b172d0dd. The user revoked the token on
# 2026-10-20 and chose not to rewrite history (published tags). Only these two
# files in that one commit are allowlisted.
[[allowlists]]
description = "SF-001 revoked Telegram bot token (history only)"
condition = "AND"
commits = ["c798a7e70c3bc467346710f522c3b4cd289cbb59"]
paths = [
  '''^autobyteus-server-ts/extensions/messaging-gateway/config/(gateway\.env|provider-config\.json)$''',
]
