# R-002 premise check harness (autobyteus-279): test-only, not the product app. `run.sh` copies this folder and the built
# check page (as Web/) to a temp folder, generates the project with XcodeGen and runs it on a simulator.
name: R002Harness
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO
targets:
  R002Harness:
    type: application
    platform: iOS
    sources:
      - path: R002Harness
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.autobyteus.r002harness
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
