<!doctype html><html><head><style>body{margin:0;font:14px sans-serif} .row{height:40px;border-bottom:1px solid #ddd} /* A row that leaves the tree (its Task is DONE) fades and its height closes in 200 ms; the rows    below move up with it. New rows appear at once. Reduced motion removes rows immediately. */ /* After the move rule on purpose: a row can start leaving while it still carries the move class    (its own FLIP move in progress), and its leave must still fade and collapse. */ .tree-row-leave-active {   overflow: hidden;   transition: opacity 200ms ease-out, max-height 200ms ease-out, margin-top 200ms ease-out, transform 200ms ease-out; } /* A two-line row (a Task summary under the name) starts from its own measured height. */ .tree-row-leave-from {   opacity: 1;   max-height: var(--tree-row-leave-height, 2rem); } .tree-row-leave-to {   opacity: 0;   max-height: 0;   min-height: 0;   margin-top: 0 !important; } @media (prefers-reduced-motion: reduce) {   .tree-row-leave-active,   .tree-row-move {     transition: none;   } } </style>
<script src="vue.global.js"></script></head><body><div id="app"></div><script>
const { createApp, ref, h, TransitionGroup } = Vue;
createApp({ setup(){ const n=ref(12); window.removeRow=()=>{n.value-=1};
 return ()=>h('div',[h(TransitionGroup,{tag:'div',name:'tree-row',onBeforeLeave:(el)=>el.style.setProperty('--tree-row-leave-height',el.offsetHeight+'px')},
   ()=>Array.from({length:n.value},(_,i)=>h('div',{key:'r'+i,class:'row'},'row '+i))), h('div',{class:'row',id:'next'},'next')]) } }).mount('#app');
</script></body></html>
