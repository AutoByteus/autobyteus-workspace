<!doctype html><html><head><meta charset="utf-8"><script src="purify.js"></script></head><body><pre id="out"></pre>
<script>
const html = '<h1>Hello World</h1>\n<p>para <strong>b</strong></p>\n';
const opts = { ADD_ATTR: ['class','style'], ADD_TAGS: ['math','semantics','mrow','mi','mo','mn','msup','msub','annotation','mtext'], USE_PROFILES: { html: true } };

</script></body></html>
