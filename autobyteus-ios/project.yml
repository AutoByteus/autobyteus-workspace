name: AutoByteusMobile
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    IOS_BUNDLE_ID: ${IOS_BUNDLE_ID}
    IOS_SHARE_EXTENSION_BUNDLE_ID: ${IOS_SHARE_EXTENSION_BUNDLE_ID}
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ANALYZER_NONNULL: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
targets:
  AutoByteusMobileCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AutoByteusMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.autobyteus.mobile.core
        DEFINES_MODULE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  AutoByteusMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AutoByteusMobile
    dependencies:
      - target: AutoByteusMobileCore
      - target: AutoByteusMobileShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(IOS_BUNDLE_ID)"
        PRODUCT_NAME: AutoByteus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: AutoByteusMobile/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoByteusMobile/AutoByteusMobile.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(IOS_APPSTORE_PROVISIONING_PROFILE_SPECIFIER)"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  AutoByteusMobileShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AutoByteusMobileShareExtension
    dependencies:
      - target: AutoByteusMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(IOS_SHARE_EXTENSION_BUNDLE_ID)"
        PRODUCT_NAME: AutoByteus Share
        INFOPLIST_FILE: AutoByteusMobileShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoByteusMobileShareExtension/AutoByteusMobileShareExtension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(IOS_SHARE_EXTENSION_APPSTORE_PROVISIONING_PROFILE_SPECIFIER)"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  AutoByteusMobileCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AutoByteusMobileCoreTests
    dependencies:
      - target: AutoByteusMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.autobyteus.mobile.core.tests
        GENERATE_INFOPLIST_FILE: YES

  AutoByteusMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AutoByteusMobileUITests
    dependencies:
      - target: AutoByteusMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.autobyteus.mobile.ui-tests
        INFOPLIST_FILE: AutoByteusMobileUITests/Info.plist

schemes:
  AutoByteusMobile:
    build:
      targets:
        AutoByteusMobile: all
        AutoByteusMobileCore: all
        AutoByteusMobileShareExtension: all
    test:
      gatherCoverageData: false
      targets:
        - name: AutoByteusMobileCoreTests
        - name: AutoByteusMobileUITests
    run:
      config: Debug
